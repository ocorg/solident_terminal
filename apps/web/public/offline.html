<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1E5470">
  <title>Hors connexion · Solident</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #FBF8F2; color: #123A4F; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; padding: 16px; box-sizing: border-box; }
    main { max-width: 420px; text-align: center; }
    img { width: 96px; height: 96px; border-radius: 50%; }
    h1 { font-size: 24px; margin: 20px 0 8px; }
    p { color: #4A5A66; line-height: 1.5; margin: 0 0 8px; }
    p[dir="rtl"] { font-size: 17px; }
    button { margin-top: 20px; background: #1E5470; color: #fff; border: 0; border-radius: 10px; padding: 12px 22px; font-size: 16px; font-weight: 600; cursor: pointer; }
    button:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="Solident">
    <h1>Pas de connexion</h1>
    <p>Vérifiez votre réseau, puis réessayez.</p>
    <p dir="rtl" lang="ar">لا يوجد اتصال بالإنترنت. تحقق من الشبكة ثم أعد المحاولة.</p>
    <p lang="en">You are offline. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
  </main>
</body>
</html>
